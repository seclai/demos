<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Seclai brand: purple primary (#7e22ce → #581c87), amber accent (#fcd34d → #f59e0b). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <g fill="url(#amber)">
    <rect x="22" y="52" width="12" height="24" rx="6"/>
    <rect x="40" y="38" width="12" height="52" rx="6"/>
    <rect x="58" y="24" width="12" height="80" rx="6"/>
    <rect x="76" y="40" width="12" height="48" rx="6"/>
    <rect x="94" y="54" width="12" height="20" rx="6"/>
  </g>
</svg>
